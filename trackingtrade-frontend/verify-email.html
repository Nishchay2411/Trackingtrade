<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - TrackingTrade</title>
  <script src="js/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: white;
    }
    .card {
      background: #1e293b;
      padding: 48px 40px;
      border-radius: 16px;
      text-align: center;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    #message { margin-top: 20px; font-size: 16px; line-height: 1.6; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #7C5CFC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #7C5CFC;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .success { color: #4ade80; }
    .error   { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📧</div>
    <h1>Email Verification</h1>
    <p class="sub">Please wait while we verify your account...</p>
    <div class="spinner" id="spinner"></div>
    <div id="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const msgEl  = document.getElementById('message');
    const spinner = document.getElementById('spinner');

    async function verifyEmail() {
      if (!token) {
        spinner.style.display = 'none';
        msgEl.innerHTML = '<p class="error">❌ Invalid verification link. Please check your email and try again.</p>';
        return;
      }

      try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/auth/verify-email/${token}`);
        const data     = await response.json();

        spinner.style.display = 'none';

        if (data.success) {
          msgEl.innerHTML = `
            <p class="success">✅ Email verified successfully!</p>
            <a class="btn" href="index.html">Go to Login →</a>
          `;
        } else {
          msgEl.innerHTML = `
            <p class="error">❌ ${data.message}</p>
            <p style="color:#94a3b8;font-size:13px;margin-top:12px;">Try registering again or contact support.</p>
          `;
        }
      } catch (err) {
        spinner.style.display = 'none';
        msgEl.innerHTML = '<p class="error">❌ Verification failed. Please check your connection and try again.</p>';
      }
    }

    verifyEmail();
  </script>
</body>
</html>
