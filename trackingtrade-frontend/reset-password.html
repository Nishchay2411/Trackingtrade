```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password | TrackingTrade</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      📈 TrackingTrade
    </div>

    <h2 class="auth-title">
      Reset Password
    </h2>

    <p class="auth-subtitle">
      Enter your new password below.
    </p>

    <div
      id="alert-box"
      class="tt-alert"
      style="display:none;">
    </div>

    <!-- New Password -->
    <div class="form-group">

      <label for="new-password">
        New Password
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="new-password"
          placeholder="Minimum 8 characters"
          autocomplete="new-password"
        />

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('new-password', this)">

          👁️
        </button>

      </div>

    </div>


    <!-- Confirm Password -->
    <div class="form-group">

      <label for="confirm-password">
        Confirm Password
      </label>

      <div class="password-wrapper">

        <input
          type="password"
          id="confirm-password"
          placeholder="Re-enter password"
          autocomplete="new-password"
        />

        <button
          type="button"
          class="toggle-password"
          onclick="togglePassword('confirm-password', this)">

          👁️
        </button>

      </div>

    </div>


    <button
      id="reset-btn"
      class="btn btn-primary btn-full">

      Reset Password
    </button>

    <p class="auth-footer">
      Remembered your password?
      <a href="index.html">Back to Login</a>
    </p>

  </div>


  <script>

    // ==========================
    // DOM Elements
    // ==========================

    const alertBox = document.getElementById('alert-box');
    const resetBtn = document.getElementById('reset-btn');

    // ==========================
    // Read Token
    // ==========================

    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token');

    if (!resetToken) {

      showAlert(
        'Invalid or missing reset token. Please request a new password reset.',
        'error'
      );

      resetBtn.disabled = true;
    }

    // ==========================
    // Show Alert
    // ==========================

    function showAlert(message, type = 'error') {

      alertBox.style.display = 'flex';
      alertBox.className = `tt-alert tt-alert-${type}`;
      alertBox.textContent = message;
    }


    // ==========================
    // Toggle Password Visibility
    // ==========================

    function togglePassword(id, button) {

      const input = document.getElementById(id);

      if (input.type === 'password') {

        input.type = 'text';
        button.textContent = '🙈';

      } else {

        input.type = 'password';
        button.textContent = '👁️';
      }
    }


    // ==========================
    // Reset Password
    // ==========================

    async function doResetPassword() {

      const password =
        document.getElementById('new-password').value.trim();

      const confirmPassword =
        document.getElementById('confirm-password').value.trim();

      alertBox.style.display = 'none';

      if (!password || !confirmPassword) {
        return showAlert(
          'Please fill in all fields.'
        );
      }

      if (password !== confirmPassword) {
        return showAlert(
          'Passwords do not match.'
        );
      }

      // Same regex as backend
      const passwordRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

      if (!passwordRegex.test(password)) {

        return showAlert(
          'Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number and one special character.'
        );
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Resetting...';

      try {

        const response = await fetch(
          `${CONFIG.API_BASE_URL}/auth/reset-password`,
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              token: resetToken,
              password
            })
          }
        );

        const data = await response.json();

        if (data.success) {

          showAlert(
            data.message +
            ' Redirecting to login...',
            'success'
          );

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2500);

        } else {

          showAlert(
            data.message ||
            'Unable to reset password.'
          );

          resetBtn.disabled = false;
          resetBtn.textContent = 'Reset Password';
        }

      } catch (error) {

        console.error('Reset Password Error:', error);

        showAlert(
          'Network error. Please try again.'
        );

        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Password';
      }
    }


    // ==========================
    // Event Listeners
    // ==========================

    resetBtn.addEventListener(
      'click',
      doResetPassword
    );

    document.querySelectorAll('input')
      .forEach(input => {

        input.addEventListener(
          'keypress',
          e => {

            if (e.key === 'Enter') {
              doResetPassword();
            }
          }
        );
      });

  </script>

</body>
</html>
```
