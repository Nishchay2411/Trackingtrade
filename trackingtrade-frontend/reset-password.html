<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - TrackingTrade</title>
  <script src="js/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: white;
    }
    .card {
      background: #1e293b;
      padding: 48px 40px;
      border-radius: 16px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .icon { font-size: 48px; text-align:center; margin-bottom: 16px; }
    h1 { font-size: 24px; text-align:center; margin-bottom: 8px; }
    .sub { color: #94a3b8; font-size: 14px; text-align:center; margin-bottom: 28px; }
    label { display:block; font-size:13px; color:#94a3b8; margin-bottom:6px; }
    input {
      width: 100%; padding: 12px 14px;
      background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: white; font-size: 15px;
      margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #7C5CFC; }
    .btn {
      width: 100%; padding: 13px;
      background: #7C5CFC; color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #alert {
      padding: 12px 14px; border-radius: 8px;
      font-size: 14px; margin-bottom: 16px;
      display: none;
    }
    .alert-error   { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
    .alert-success { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .back { text-align:center; margin-top:20px; font-size:13px; color:#94a3b8; }
    .back a { color: #7C5CFC; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Reset Password</h1>
    <p class="sub">Enter your new password below.</p>

    <div id="alert"></div>

    <label>New Password</label>
    <input type="password" id="password" placeholder="Min 8 chars, uppercase, number, symbol" />

    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Re-enter your new password" />

    <button class="btn" id="btn" onclick="doReset()">Reset Password</button>

    <p class="back">Remembered it? <a href="index.html">Back to Login</a></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const alertEl = document.getElementById('alert');
    const btn     = document.getElementById('btn');

    if (!token) {
      showAlert('error', '❌ Invalid or missing reset token. Please request a new password reset.');
      btn.disabled = true;
    }

    function showAlert(type, msg) {
      alertEl.className = type === 'error' ? 'alert-error' : 'alert-success';
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
    }

    async function doReset() {
      const password = document.getElementById('password').value.trim();
      const confirm  = document.getElementById('confirm').value.trim();

      alertEl.style.display = 'none';

      if (!password || !confirm) return showAlert('error', 'Please fill in both fields.');
      if (password !== confirm)  return showAlert('error', 'Passwords do not match.');

      btn.disabled    = true;
      btn.textContent = 'Resetting...';

      try {
        const res  = await fetch(`${CONFIG.API_BASE_URL}/auth/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('success', '✅ ' + data.message + ' Redirecting to login...');
          setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        } else {
          showAlert('error', '❌ ' + (data.message || 'Something went wrong.'));
          btn.disabled    = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        showAlert('error', '❌ Network error. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Reset Password';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
  </script>
</body>
</html>
